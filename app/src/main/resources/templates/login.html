<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Console N2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/console.css}">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .form-signin {
            max-width: 400px;
            width: 100%;
            padding: 28px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
        }
        .brand { color: #22c55e; font-weight: 700; }
        .form-control { height: 48px; }
        .hint { color: #c8c8c8; font-size: 0.85rem; }
    </style>
</head>
<body>
<main class="form-signin text-center">
    <form th:action="@{/login}" method="post">
        <h2 class="h3 mb-1 fw-normal"><span class="brand">Ney Adrian</span></h2>
        <p class="hint mb-4">Console N2 · Redes de Computadores II</p>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">Utilizador ou senha inválidos.</div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">Sessão terminada com sucesso.</div>

        <div class="text-start mb-3">
            <label class="form-label" for="username">Nome de utilizador</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="admin" required>
        </div>
        <div class="text-start mb-4">
            <label class="form-label" for="password">Senha</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
        </div>
        <button class="w-100 btn btn-lg btn-success" type="submit">Entrar</button>
        <p class="mt-4 mb-0 hint">admin / operador / leitor · senha 123</p>
    </form>
</main>
</body>
</html>
