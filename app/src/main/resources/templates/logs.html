<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logs Técnicos - Console N2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/console.css}">
</head>
<body>
<div th:replace="~{fragments/chrome :: sidebar('logs')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/chrome :: userbar}"></div>
    
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="text-white mb-1"><i class="bi bi-journal-text me-2"></i> Logs Técnicos do Sistema</h2>
            <small class="text-muted"><i class="bi bi-server me-1"></i> Servidor Debian 13 (192.168.100.10) via SSH journalctl</small>
        </div>
    </div>

    <!-- Filtros de Serviço e Quantidade de Linhas (Requisito Seção 3 e 7.6) -->
    <div class="content-card mb-4">
        <form th:action="@{/logs}" method="get" class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label text-light">Filtrar por Serviço</label>
                <select name="service" class="form-select bg-dark border-secondary text-white">
                    <option value="geral" th:selected="${selectedService == 'geral'}">Todos os Serviços (Geral - journalctl)</option>
                    <option value="apache2" th:selected="${selectedService == 'apache2'}">Apache Web Server (apache2 / access.log)</option>
                    <option value="vsftpd" th:selected="${selectedService == 'vsftpd'}">vsftpd (FTP Server)</option>
                    <option value="postfix" th:selected="${selectedService == 'postfix'}">Postfix (SMTP Mail)</option>
                    <option value="dovecot" th:selected="${selectedService == 'dovecot'}">Dovecot (IMAP Mail)</option>
                    <option value="ssh" th:selected="${selectedService == 'ssh'}">OpenSSH Daemon (ssh)</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label text-light">Quantidade de Linhas</label>
                <select name="lines" class="form-select bg-dark border-secondary text-white">
                    <option value="30" th:selected="${selectedLines == 30}">30 linhas</option>
                    <option value="50" th:selected="${selectedLines == 50}">50 linhas</option>
                    <option value="100" th:selected="${selectedLines == 100}">100 linhas</option>
                </select>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-filter me-1"></i> Consultar Logs no Debian
                </button>
            </div>
        </form>
    </div>

    <!-- Terminal de Logs -->
    <div class="content-card p-0 overflow-hidden">
        <div class="p-3 border-bottom border-secondary d-flex justify-content-between align-items-center bg-dark">
            <span class="text-light">
                <i class="bi bi-terminal me-2 text-info"></i>
                Visualizando: <span class="badge bg-secondary" th:text="${selectedService}">geral</span>
                (<span th:text="${selectedLines}">50</span> linhas)
            </span>
            <a th:href="@{/logs(service=${selectedService}, lines=${selectedLines})}" class="btn btn-sm btn-outline-light">
                <i class="bi bi-arrow-clockwise me-1"></i> Atualizar Agora
            </a>
        </div>
        <pre class="console-output m-0 p-3" style="background:#111; color:#00ff66; font-family: monospace; max-height: 500px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;" th:text="${logs}">Nenhum log retornado pelo servidor...</pre>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
