<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logs Técnicos - Console N2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; display: flex; min-height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { width: 250px; background-color: #181818; border-right: 1px solid #282828; padding: 24px 16px; display: flex; flex-direction: column; flex-shrink: 0; min-height: 100vh; }
        .sidebar-brand { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #282828; text-align: center; }
        .sidebar-brand h5 { color: #22c55e; font-size: 1.25rem; font-weight: 700; margin: 0 0 4px 0; }
        .sidebar-brand small { color: #888888; font-size: 0.85rem; }
        .nav-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
        .nav-item-link { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #a0a0a0; text-decoration: none; border-radius: 8px; font-size: 0.95rem; transition: all 0.15s ease-in-out; }
        .nav-item-link:hover { background-color: #222222; color: #ffffff; }
        .nav-item-link.active { background-color: #2a2a2a; color: #ffffff; font-weight: 500; }
        .main-wrapper { flex-grow: 1; padding: 36px 40px; overflow-y: auto; background-color: #121212; }
        .content-card { background-color: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 10px; padding: 24px; margin-bottom: 24px; }
        .console-output { color: #00ff00; background-color: #000; padding: 15px; margin: 0; max-height: 600px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; border-radius: 6px; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">
        <h5>IFCE Console</h5>
        <small>N2 - Redes II</small>
    </div>
    <ul class="nav-list">
        <li><a th:href="@{/dashboard}" class="nav-item-link"><i class="bi bi-house"></i> Visão Geral</a></li>
        <li><a th:href="@{/arquivos}" class="nav-item-link"><i class="bi bi-folder"></i> Arquivos (FTP)</a></li>
        <li><a th:href="@{/email}" class="nav-item-link"><i class="bi bi-envelope"></i> E-mail</a></li>
        <li><a th:href="@{/ssh}" class="nav-item-link"><i class="bi bi-terminal"></i> Acesso SSH</a></li>
        <li><a th:href="@{/logs}" class="nav-item-link active"><i class="bi bi-journal-text"></i> Logs Técnicos</a></li>
    </ul>
    <div class="mt-auto pt-3 border-top border-secondary">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </form>
    </div>
</div>

<div class="main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-white">Logs Técnicos do Sistema</h2>
    </div>

    <div class="content-card p-0 overflow-hidden">
        <div class="p-3 border-bottom border-secondary d-flex justify-content-between align-items-center bg-dark">
            <span class="text-light">Visualizando: <code>journalctl</code> (Eventos do Sistema)</span>
            <a th:href="@{/logs}" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-clockwise"></i> Atualizar Logs</a>
        </div>
        <div class="card-body p-0">
            <pre class="console-output" th:text="${logs}">Nenhum log encontrado...</pre>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
