<!DOCTYPE html>
<html lang="pt-PT" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envio de E-mail - Console N2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #121212; }
        .sidebar { min-height: 100vh; background-color: #1e1e1e; }
        .nav-link { color: #adb5bd; padding: 12px 15px; margin-bottom: 5px; }
        .nav-link.active, .nav-link:hover { color: #fff; background-color: #2b2b2b; border-radius: 6px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral -->
        <div class="col-md-3 col-lg-2 px-0 sidebar d-flex flex-column border-end border-secondary">
            <div class="p-3 text-center border-bottom border-secondary mb-3">
                <h5 class="text-success fw-bold mb-0">IFCE Console</h5>
                <small class="text-muted">N2 - Redes II</small>
            </div>
            <ul class="nav flex-column px-2">
                <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link"><i class="bi bi-house-door me-2"></i> Visão Geral</a></li>
                <li class="nav-item"><a th:href="@{/arquivos}" class="nav-link"><i class="bi bi-folder me-2"></i> Arquivos (FTP)</a></li>
                <li class="nav-item"><a th:href="@{/email}" class="nav-link active"><i class="bi bi-envelope me-2"></i> E-mail</a></li>
                <li class="nav-item"><a th:href="@{/ssh}" class="nav-link"><i class="bi bi-terminal me-2"></i> Acesso SSH</a></li>
                <li class="nav-item"><a th:href="@{/logs}" class="nav-link"><i class="bi bi-journal-text me-2"></i> Logs Técnicos</a></li>
            </ul>
        </div>

        <!-- Conteúdo Principal -->
        <div class="col-md-9 col-lg-10 p-4">
            <h2 class="mb-4"><i class="bi bi-envelope-paper me-2"></i>Envio de E-mail (SMTP)</h2>

            <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <div class="card p-4 w-75">
                <form th:action="@{/enviar-email}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-muted">Destinatário:</label>
                        <input type="email" name="destinatario" class="form-control bg-dark text-white border-secondary" required placeholder="email@exemplo.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Assunto:</label>
                        <input type="text" name="assunto" class="form-control bg-dark text-white border-secondary" required placeholder="Assunto do alerta">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">Mensagem:</label>
                        <textarea name="mensagem" class="form-control bg-dark text-white border-secondary" rows="5" required placeholder="Escreva a mensagem aqui..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-send me-2"></i> Enviar Mensagem</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
